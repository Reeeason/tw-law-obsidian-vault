<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <rect width="880" height="420" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1F2328">Use this template → 建立你自己的私人儲存庫（示意圖）</text>
  <!-- 步驟一 -->
  <rect x="30" y="64" width="260" height="96" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
  <rect x="60" y="88" width="200" height="34" rx="6" fill="#1F883D"/>
  <text x="160" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Use this template ▾</text>
  <text x="160" y="146" text-anchor="middle" font-size="13" fill="#1F2328">選 Create a new repository</text>
  <text x="40" y="110" font-size="15" font-weight="bold" fill="#CF222E">①</text>
  <!-- 表單 -->
  <rect x="320" y="64" width="530" height="330" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="340" y="94" font-size="16" font-weight="bold" fill="#1F2328">Create a new repository</text>
  <text x="340" y="126" font-size="13" fill="#57606A">Owner *　　　　Repository name *</text>
  <rect x="340" y="136" width="120" height="30" rx="4" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="352" y="156" font-size="13" fill="#1F2328">你的帳號 ▾</text>
  <rect x="470" y="136" width="250" height="30" rx="4" fill="#FFFFFF" stroke="#0969DA" stroke-width="2"/>
  <text x="482" y="156" font-size="13" fill="#1F2328">my-law-vault</text>
  <text x="730" y="156" font-size="13" font-weight="bold" fill="#CF222E">② 取名</text>
  <rect x="340" y="190" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#57606A"/>
  <text x="368" y="204" font-size="14" fill="#1F2328">Public</text>
  <rect x="334" y="222" width="400" height="50" rx="6" fill="#FFF8C5" stroke="#CF222E" stroke-width="2"/>
  <circle cx="349" cy="238" r="9" fill="#FFFFFF" stroke="#0969DA" stroke-width="2"/>
  <circle cx="349" cy="238" r="4.5" fill="#0969DA"/>
  <text x="368" y="243" font-size="14" font-weight="bold" fill="#1F2328">Private</text>
  <text x="368" y="263" font-size="12" fill="#57606A">只有你看得到（你的筆記放這裡）</text>
  <text x="742" y="252" font-size="13" font-weight="bold" fill="#CF222E">③ 選 Private</text>
  <rect x="340" y="330" width="270" height="36" rx="6" fill="#1F883D"/>
  <text x="475" y="353" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Create repository from template</text>
  <text x="625" y="353" font-size="13" font-weight="bold" fill="#CF222E">④ 建立</text>
  <text x="30" y="250" font-size="13" fill="#57606A">
    <tspan x="30" dy="0">範本複製出來的儲存庫</tspan>
    <tspan x="30" dy="22">和原本的公開庫互相獨立，</tspan>
    <tspan x="30" dy="22">你的筆記不會被別人看到。</tspan>
  </text>
</svg>
