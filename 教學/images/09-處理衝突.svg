<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <rect width="880" height="380" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1F2328">發生衝突時，Obsidian 裡看到的樣子（示意圖）</text>
  <rect x="520" y="56" width="330" height="44" rx="6" fill="#24292F"/>
  <text x="535" y="76" font-size="12" fill="#FFFFFF">Merge conflict in 1 file. Resolve conflicts</text>
  <text x="535" y="93" font-size="12" fill="#FFFFFF">and commit manually.</text>
  <rect x="30" y="116" width="820" height="200" rx="8" fill="#1E1E1E"/>
  <text x="46" y="146" font-size="14" fill="#DDDDDD">第一行（兩邊相同）</text>
  <rect x="46" y="158" width="560" height="30" fill="#2D4A43"/>
  <text x="56" y="178" font-size="14" fill="#DDDDDD">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <g font-size="12" text-anchor="middle">
    <rect x="610" y="158" width="74" height="30" fill="#3B5249"/><text x="647" y="178" fill="#FFFFFF">Keep ours</text>
    <rect x="688" y="158" width="80" height="30" fill="#33456B"/><text x="728" y="178" fill="#FFFFFF">Keep theirs</text>
    <rect x="772" y="158" width="70" height="30" fill="#3A3A3A" stroke="#FF6B6B" stroke-width="3"/><text x="807" y="178" fill="#FFFFFF" font-weight="bold">Keep both</text>
  </g>
  <rect x="46" y="188" width="560" height="30" fill="#22332E"/>
  <text x="56" y="208" font-size="14" fill="#DDDDDD">這台電腦寫的內容（ours）</text>
  <text x="56" y="236" font-size="14" fill="#888888">=======</text>
  <rect x="46" y="244" width="560" height="30" fill="#1D2A40"/>
  <text x="56" y="264" font-size="14" fill="#DDDDDD">另一台電腦寫的內容（theirs）</text>
  <rect x="46" y="274" width="560" height="30" fill="#1B3A63"/>
  <text x="56" y="294" font-size="14" fill="#DDDDDD">&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main</text>
  <text x="30" y="346" font-size="15" font-weight="bold" fill="#CF222E">拿不準時，一律逐塊按 Keep both，再手動刪掉多餘的部分，最後按 Ctrl＋Alt＋S。</text>
  <text x="30" y="370" font-size="13" fill="#57606A">右上角整排的 Keep all ours／theirs 會套用到整份檔案的所有衝突，容易誤刪。</text>
</svg>
